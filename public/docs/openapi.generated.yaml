          type: string
          description: 增量同步起点 ISO 时间
        type:
          type: string
          enum:
            - search_history
            - favorites
            - settings
            - user_data
          description: search_history / favorites / settings / user_data
    SyncRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - search_history
            - favorites
            - settings
            - user_data
          description: 数据类型
          nullable: false
        data:
          type: object
          additionalProperties: {}
          description: 同步负载
          nullable: false
        timestamp:
          type: string
          description: ISO 客户端时间戳
          nullable: false
        deviceId:
          type: string
          description: 设备 ID
          nullable: false
      required:
        - type
