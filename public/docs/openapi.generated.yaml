                  description: 使用率 %
                cores:
                  type: number
                  description: 核心数
              required:
                - usage
                - cores
              description: CPU 信息
            version:
              type: string
              description: Node 版本
            platform:
              type: string
              description: 平台
          required:
            - uptime
            - memory
            - cpu
            - version
            - platform
          description: 系统指标
        summary:
          type: object
          properties:
            totalServices:
              type: number
              description: 服务总数
            healthyServices:
              type: number
              description: 健康数
            degradedServices:
              type: number
              description: 降级数
            downServices:
              type: number
              description: 宕机数
            averageResponseTime:
              type: number
              description: 平均响应 ms
          required:
            - totalServices
            - healthyServices
            - degradedServices
            - downServices
            - averageResponseTime
          description: 汇总
