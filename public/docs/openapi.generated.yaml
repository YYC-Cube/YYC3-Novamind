                description: ISO 最近检查
              details:
                type: string
                description: 详情
            required:
              - status
              - responseTime
              - lastCheck
          description: 各服务状态映射
        system:
          type: object
          properties:
            uptime:
              type: number
              description: 进程运行秒数
            memory:
              type: object
              additionalProperties:
                type: number
              description: 内存使用
            cpu:
              type: object
              properties:
