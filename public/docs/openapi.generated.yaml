openapi: 3.0.0
info:
  title: YYC³ NovaMind API
  version: 2.0.0
  description: YYC³ NovaMind 全栈 API 契约（自动生成）
servers:
  - url: http://localhost:3218/api
    description: Local development server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AIConfigUpdate:
      type: object
      properties:
        action:
          type: string
          description: 动作：optimize_performance | clear_cache | update_config
          nullable: false
        data:
          type: object
          properties:
            provider:
              type: string
              description: 提供商名称
              nullable: true
            config:
              type: object
              additionalProperties: {}
              description: 配置对象
              nullable: true
          nullable: true
      required:
        - action
    AIQuery:
      type: object
      properties:
        action:
          type: string
          description: status / providers / current_provider / test_provider / health
        provider:
          type: string
          description: test_provider 时必填
      required:
        - action
    AIRequest:
      type: object
      properties:
        action:
          type: string
          description: 动作：chat | stream_chat | switch_provider | select_best_provider | batch_process
          nullable: false
        data:
          type: object
          properties:
            messages:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                    enum:
                      - system
                      - user
                      - assistant
                    description: 消息角色
                    nullable: false
                  content:
                    type: string
                    description: 消息内容（1-32000 字符）
                    nullable: false
                required:
                  - role
                  - content
              description: 对话消息列表（chat / stream_chat）
              nullable: true
            provider:
              type: string
              description: 目标提供商（switch_provider）
              nullable: true
            temperature:
              type: number
              description: 采样温度
              nullable: true
            maxTokens:
              type: number
              description: 最大 token
              nullable: true
            model:
              type: string
              description: 模型名称
              nullable: true
            items:
              type: array
              items:
                type: object
                properties:
                  content:
                    type: string
                    nullable: false
                required:
                  - content
              description: 批处理项目（batch_process）
              nullable: true
            processorType:
              type: string
              description: 批处理器类型：summarize | translate | analyze
              nullable: true
          description: 动作数据负载
          nullable: true
        options:
          type: object
          additionalProperties: {}
          description: 扩展选项
          nullable: true
      required:
        - action
    AIResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 是否成功
        data:
          description: 业务数据负载
        message:
          type: string
          description: 附加消息
        error:
          oneOf:
            - type: object
              properties:
                type:
                  type: string
                  description: 错误类型标识
                message:
                  type: string
                  description: 用户可读错误信息
                id:
                  type: string
                  description: 错误唯一 ID（链路追踪）
                details:
                  type: string
                  description: 调试详情
              required:
                - type
                - message
            - type: string
          description: 失败时的错误结构
        metadata:
          type: object
          properties:
            processingTime:
              type: number
              description: 处理耗时 ms
            provider:
              type: string
              description: 使用的提供商
          required:
            - processingTime
            - provider
          description: 元数据（处理耗时 / 实际提供商）
    AIStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 是否成功
        data:
          type: object
          properties:
            activeProvider:
              type: string
              description: 当前活跃提供商
            providers:
              type: object
              additionalProperties:
                type: object
                properties:
                  available:
                    type: boolean
                  latency:
                    type: number
                required:
                  - available
              description: 各提供商可用性
          required:
            - activeProvider
            - providers
          description: AI 服务状态
        message:
          type: string
          description: 附加消息
        error:
          oneOf:
            - type: object
              properties:
                type:
                  type: string
                  description: 错误类型标识
                message:
                  type: string
                  description: 用户可读错误信息
                id:
                  type: string
                  description: 错误唯一 ID（链路追踪）
                details:
                  type: string
                  description: 调试详情
              required:
                - type
                - message
            - type: string
          description: 失败时的错误结构
      required:
        - data
    ApiEnvelope:
      type: object
      properties:
        success:
          type: boolean
          description: 是否成功
        data:
          description: 业务数据负载
        message:
          type: string
          description: 附加消息
        error:
          oneOf:
            - type: object
              properties:
                type:
                  type: string
                  description: 错误类型标识
                message:
                  type: string
                  description: 用户可读错误信息
                id:
                  type: string
                  description: 错误唯一 ID（链路追踪）
                details:
                  type: string
                  description: 调试详情
              required:
                - type
                - message
            - type: string
          description: 失败时的错误结构
      required:
        - success
    ApiErrorInfo:
      type: object
      properties:
        type:
          type: string
          description: 错误类型标识
        message:
          type: string
          description: 用户可读错误信息
        id:
          type: string
          description: 错误唯一 ID（链路追踪）
        details:
          type: string
          description: 调试详情
      required:
        - type
        - message
    AuthQuery:
      type: object
      properties:
        action:
          type: string
          description: current_user / verify_email
        token:
          type: string
          description: verify_email 时必填
      required:
        - action
    AuthRequest:
      type: object
      properties:
        action:
          type: string
          description: 动作：login | register | wechat_login | refresh_token | reset_password | change_password | logout
          nullable: false
        email:
          type: string
          description: 邮箱
          nullable: true
        username:
          type: string
          description: 用户名
          nullable: true
        password:
          type: string
          description: 密码
          nullable: true
        confirmPassword:
          type: string
          description: 确认密码（register）
          nullable: true
        rememberMe:
          type: boolean
          description: 记住我（login）
          nullable: true
        acceptTerms:
          type: boolean
          description: 同意条款（register）
          nullable: true
        inviteCode:
          type: string
          description: 邀请码（register）
          nullable: true
        code:
          type: string
          description: 微信 code（wechat_login）
          nullable: true
        state:
          type: string
          description: 微信 state（wechat_login）
          nullable: true
        oldPassword:
          type: string
          description: 旧密码（change_password）
          nullable: true
        newPassword:
          type: string
          description: 新密码（change_password）
          nullable: true
      required:
        - action
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 是否成功
        data:
          description: 业务数据负载
        message:
          type: string
          description: 附加消息
        error:
          oneOf:
            - type: object
              properties:
                type:
                  type: string
                  description: 错误类型标识
                message:
                  type: string
                  description: 用户可读错误信息
                id:
                  type: string
                  description: 错误唯一 ID（链路追踪）
                details:
                  type: string
                  description: 调试详情
              required:
                - type
                - message
            - type: string
          description: 失败时的错误结构
        accessToken:
          type: string
          description: 访问令牌（login / wechat_login 成功时）
        refreshToken:
          type: string
          description: 刷新令牌
        user:
          type: object
          properties:
            id:
              type: string
              description: 用户 ID
            email:
              type: string
              description: 邮箱
            username:
              type: string
              description: 用户名
          required:
            - id
            - email
            - username
          description: 用户信息
    AuthUpdate:
      type: object
      properties:
        action:
          type: string
          description: 动作：update_profile
          nullable: false
        updates:
          type: object
          additionalProperties: {}
          description: 待更新的用户字段
          nullable: true
      required:
        - action
    ChatHealthResponse:
      type: object
      properties:
        status:
          type: string
          description: 服务状态
        message:
          type: string
          description: 状态说明
        timestamp:
          type: string
          description: ISO 时间戳
      required:
        - status
        - message
        - timestamp
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
          description: 消息角色
          nullable: false
        content:
          type: string
          description: 消息内容（1-32000 字符）
          nullable: false
      required:
        - role
        - content
    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - system
                  - user
                  - assistant
                description: 消息角色
                nullable: false
              content:
                type: string
                description: 消息内容（1-32000 字符）
                nullable: false
            required:
              - role
              - content
          description: 对话消息列表（1-50 条）
          nullable: false
        model:
          type: string
          description: 模型名称
          nullable: true
        temperature:
          type: number
          description: 采样温度 0-2
          nullable: true
        maxTokens:
          type: number
          description: 最大生成 token 数
          nullable: true
        stream:
          type: boolean
          description: 是否流式返回
          nullable: true
      required:
        - messages
    ChatResponse:
      type: object
      properties:
        id:
          type: string
          description: 响应唯一 ID
        choices:
          type: array
          items:
            type: object
            properties:
              message:
                type: object
                properties:
                  role:
                    type: string
                    enum:
                      - system
                      - user
                      - assistant
                    description: 消息角色
                  content:
                    type: string
                    description: 消息内容（1-32000 字符）
                required:
                  - role
                  - content
                description: 助手回复消息
              finish_reason:
                type: string
                description: 结束原因
            required:
              - message
              - finish_reason
          description: OpenAI 兼容 choices 结构
        usage:
          type: object
          properties:
            prompt_tokens:
              type: number
              description: 提示词 token 数
            completion_tokens:
              type: number
              description: 生成 token 数
            total_tokens:
              type: number
              description: 总 token 数
          required:
            - prompt_tokens
            - completion_tokens
            - total_tokens
          description: token 用量
        metadata:
          type: object
          properties:
            responseTime:
              type: number
              description: 服务端处理耗时 ms
            model:
              type: string
              description: 实际使用的模型
            timestamp:
              type: number
              description: 服务端时间戳
          required:
            - responseTime
            - model
            - timestamp
          description: 服务端元数据
      required:
        - id
        - choices
        - usage
        - metadata
    ChatRole:
      type: string
      enum:
        - system
        - user
        - assistant
    ChatUsage:
      type: object
      properties:
        prompt_tokens:
          type: number
          description: 提示词 token 数
        completion_tokens:
          type: number
          description: 生成 token 数
        total_tokens:
          type: number
          description: 总 token 数
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
    DatabaseActionRequest:
      type: object
      properties:
        action:
          type: string
          description: >-
            动作：connect | switch | close | save_history | save_favorite | delete_favorite | save_conversation |
            update_conversation | query | transaction
          nullable: false
        data:
          type: object
          properties:
            configName:
              type: string
              description: 配置名（connect）
              nullable: true
            connectionId:
              type: string
              description: 连接 ID（switch / close）
              nullable: true
            question:
              type: string
              description: 问题（save_history）
              nullable: true
            answer:
              type: string
              description: 答案（save_history）
              nullable: true
            category:
              type: string
              description: 分类
              nullable: true
            tags:
              type: array
              items:
                type: string
              description: 标签
              nullable: true
            title:
              type: string
              description: 标题（save_favorite / save_conversation）
              nullable: true
            content:
              type: string
              description: 内容（save_favorite）
              nullable: true
            type:
              type: string
              description: 收藏类型
              nullable: true
            id:
              oneOf:
                - type: number
                - type: string
              description: 收藏 ID（delete_favorite）
              nullable: true
            userId:
              type: string
              description: 用户 ID
              nullable: true
            messages:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                    enum:
                      - system
                      - user
                      - assistant
                    description: 消息角色
                    nullable: false
                  content:
                    type: string
                    description: 消息内容（1-32000 字符）
                    nullable: false
                required:
                  - role
                  - content
              description: 消息列表（save_conversation）
              nullable: true
            updates:
              type: object
              additionalProperties: {}
              description: 更新负载
              nullable: true
            sql:
              type: string
              description: SQL（query）
              nullable: true
            params:
              type: array
              items: {}
              description: SQL 参数
              nullable: true
            operations:
              type: array
              items:
                type: object
                properties:
                  sql:
                    type: string
                    nullable: false
                  params:
                    type: array
                    items: {}
                    nullable: true
                required:
                  - sql
              description: 事务操作列表（transaction）
              nullable: true
          nullable: true
      required:
        - action
    DatabaseDeleteQuery:
      type: object
      properties:
        action:
          type: string
          description: favorite / connection
        id:
          type: string
          description: 目标 ID，必填
        userId:
          type: string
          description: 可选用户过滤
      required:
        - action
        - id
    DatabaseQuery:
      type: object
      properties:
        action:
          type: string
          description: health / connections / history / search_history / favorites / conversations
        userId:
          type: string
          description: 可选用户过滤
        query:
          type: string
          description: search_history 时必填
        limit:
          type: number
          description: history 分页，默认 50
      required:
        - action
    DatabaseQueryResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 是否成功
        data: {}
        message:
          type: string
          description: 附加消息
        error:
          oneOf:
            - type: object
              properties:
                type:
                  type: string
                  description: 错误类型标识
                message:
                  type: string
                  description: 用户可读错误信息
                id:
                  type: string
                  description: 错误唯一 ID（链路追踪）
                details:
                  type: string
                  description: 调试详情
              required:
                - type
                - message
            - type: string
          description: 失败时的错误结构
    ImageAnalyzeInfoResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
          description: 支持的图片格式
        supportedFormats:
          type: array
          items:
            type: string
          description: 支持的图片格式
        maxSize:
          type: string
          description: 大小上限
        features:
          type: array
          items:
            type: string
          description: 功能列表
      required:
        - status
        - message
        - supportedFormats
        - maxSize
        - features
    ImageAnalyzeResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 是否成功
        data:
          type: object
          properties:
            analysis:
              type: string
              description: AI 分析文本
            imageInfo:
              type: object
              properties:
                filename:
                  type: string
                  description: 文件名
                type:
                  type: string
                  description: MIME 类型
                size:
                  type: number
                  description: 大小 bytes
                dimensions:
                  type: string
                  description: 尺寸描述
              required:
                - filename
                - type
                - size
              description: 图片元信息
            processedAt:
              type: string
              description: ISO 处理时间
          required:
            - analysis
            - imageInfo
            - processedAt
        message:
          type: string
          description: 附加消息
        error:
          oneOf:
            - type: object
              properties:
                type:
                  type: string
                  description: 错误类型标识
                message:
                  type: string
                  description: 用户可读错误信息
                id:
                  type: string
                  description: 错误唯一 ID（链路追踪）
                details:
                  type: string
                  description: 调试详情
              required:
                - type
                - message
            - type: string
          description: 失败时的错误结构
    OfflineProcessRequest:
      type: object
      properties:
        query:
          type: string
          description: 查询内容
          nullable: true
    OfflineTestResponse:
      type: object
      properties:
        message:
          type: string
          description: 提示消息
        offline:
          type: boolean
          description: 是否离线
        timestamp:
          type: string
          description: ISO 时间戳
        data:
          type: object
          properties:
            searchResults:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: 结果 ID
                  title:
                    type: string
                    description: 标题
                  description:
                    type: string
                    description: 描述
                  url:
                    type: string
                    description: 链接
                  type:
                    type: string
                    description: 类型
                  relevance:
                    type: number
                    description: 相关度 0-1
                  timestamp:
                    type: string
                    description: ISO 时间戳
                required:
                  - id
                  - title
                  - description
                  - url
                  - type
                  - relevance
                  - timestamp
              description: 搜索结果
            suggestions:
              type: array
              items:
                type: string
              description: 建议词
            stats:
              type: object
              properties:
                totalResults:
                  type: number
                  description: 总结果数
                searchTime:
                  type: number
                  description: 搜索耗时秒
                sources:
                  type: array
                  items:
                    type: string
                  description: 来源列表
              required:
                - totalResults
                - searchTime
                - sources
              description: 统计
          required:
            - searchResults
            - suggestions
            - stats
      required:
        - message
        - offline
        - timestamp
    PerformanceActionRequest:
      type: object
      properties:
        action:
          type: string
          description: 动作：optimize | clear_cache | process_file | batch_optimize_images | preload_resources
          nullable: false
        data:
          type: object
          properties:
            file:
              type: object
              properties:
                size:
                  type: number
                  nullable: true
              description: 文件信息（process_file）
              nullable: true
            images:
              type: array
              items:
                type: object
                properties:
                  id:
                    oneOf:
                      - type: string
                      - type: number
                    nullable: true
                  size:
                    type: number
                    nullable: true
              description: 图片列表（batch_optimize_images）
              nullable: true
            optimizeOptions:
              type: object
              properties:
                format:
                  type: string
                  nullable: true
              description: 优化选项
              nullable: true
            urls:
              type: array
              items:
                type: string
              description: 预加载 URL 列表（preload_resources）
              nullable: true
          nullable: true
      required:
        - action
    PerformanceQuery:
      type: object
      properties:
        action:
          type: string
          description: report / memory / operation_stats / cache_stats
        operation:
          type: string
          description: operation_stats 时必填
      required:
        - action
    PerformanceReportResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 是否成功
        data:
          type: object
          properties:
            cacheStats:
              type: object
              additionalProperties: {}
              description: 缓存统计
            memoryUsage:
              type: object
              additionalProperties:
                type: number
              description: 内存用量
            operationStats:
              type: object
              additionalProperties: {}
              description: 操作统计
        message:
          type: string
          description: 附加消息
        error:
          oneOf:
            - type: object
              properties:
                type:
                  type: string
                  description: 错误类型标识
                message:
                  type: string
                  description: 用户可读错误信息
                id:
                  type: string
                  description: 错误唯一 ID（链路追踪）
                details:
                  type: string
                  description: 调试详情
              required:
                - type
                - message
            - type: string
          description: 失败时的错误结构
    SpeechToTextInfoResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
          description: 支持的音频格式
        supportedFormats:
          type: array
          items:
            type: string
          description: 支持的音频格式
        maxSize:
          type: string
          description: 大小上限
        languages:
          type: array
          items:
            type: string
          description: 支持语言
      required:
        - status
        - message
        - supportedFormats
        - maxSize
        - languages
    SpeechToTextResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 是否成功
        data:
          type: object
          properties:
            text:
              type: string
              description: 识别文本
            confidence:
              type: number
              description: 置信度 0-1
            language:
              type: string
              description: 语言代码
            duration:
              type: number
              description: 估算时长秒
            processedAt:
              type: string
              description: ISO 处理时间
          required:
            - text
            - confidence
            - language
            - duration
            - processedAt
        message:
          type: string
          description: 附加消息
        error:
          oneOf:
            - type: object
              properties:
                type:
                  type: string
                  description: 错误类型标识
