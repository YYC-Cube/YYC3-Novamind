        - conflicts
        - lastSync
    SystemStatusResponse:
      type: object
      properties:
        status:
          type: string
          description: 总体状态
        timestamp:
          type: string
          description: ISO 时间戳
        responseTime:
          type: number
          description: 本次检查耗时 ms
        services:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                description: 单服务状态
              responseTime:
                type: number
                description: 响应耗时 ms
