              description: 上传记录 ID
            filename:
              type: string
              description: 存储文件名
            originalName:
              type: string
              description: 原始文件名
            type:
              type: string
              description: MIME 类型
            size:
              type: number
              description: 文件大小 bytes
            extractedText:
              type: string
              description: 提取的文本内容
            analysis:
              type: string
              description: 分析摘要
            uploadedAt:
              type: string
              description: ISO 上传时间
          required:
            - id
            - filename
            - originalName
            - type
            - size
            - extractedText
            - analysis
            - uploadedAt
        message:
          type: string
          description: 附加消息
        error:
          oneOf:
            - type: object
              properties:
                type:
                  type: string
                  description: 错误类型标识
                message:
                  type: string
                  description: 用户可读错误信息
                id:
                  type: string
                  description: 错误唯一 ID（链路追踪）
                details:
                  type: string
                  description: 调试详情
              required:
                - type
                - message
            - type: string
          description: 失败时的错误结构
