name: 🌐 Pages Deploy（zy.yyc3.top）

# YYC³ NovaMind 项目落地页 → GitHub Pages
# 触发：landing page 源或本 workflow 变更推送 main；支持手动触发

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间仅一个部署，排队中的取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🌐 Inject CNAME
        run: echo 'zy.yyc3.top' > _site/CNAME 2>/dev/null || (mkdir -p _site && echo 'zy.yyc3.top' > _site/CNAME)

      - name: 🏗️ Assemble landing site
        run: |
          mkdir -p _site
          # 落地页主体（单文件，零构建依赖）
          cp landing/index.html _site/
          # 品牌资产
          mkdir -p _site/assets
          cp public/yyc3-Family.png _site/assets/
          cp public/interconnected-tech.png _site/assets/
          cp public/yyc3-icons/Web\ App/android-chrome-512.png _site/assets/icon-maskable-512.png 2>/dev/null || true
          # README 徽章引用的项目级文档资产（OpenAPI 契约展示）
          mkdir -p _site/docs
          cp public/docs/openapi.generated.yaml _site/docs/ 2>/dev/null || true

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://zy.yyc3.top
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
